name: Handle tag

on:
  push:
    tags: 
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-tag-branch:
    # This job is based on replies in https://github.community/t/how-to-create-filter-on-both-tag-and-branch/16936/6
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify tag commit is contained in main
      run: |
        # Peel annotated tags to their target commit and verify that commit is reachable from main.
        # This intentionally enforces "contained in main" semantics instead of exact main HEAD equality.
        tag_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
        if git merge-base --is-ancestor "$tag_commit" origin/main; then
          echo "Tag commit is contained in main."
        else
          echo "Tag commit is not contained in main. Exiting."
          exit 1
        fi

  get-version:
    needs: [check-tag-branch]
    runs-on: windows-2022
    steps:
    - name: Get version from tag
      id: extract-tag
      shell: bash
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    
    - name: Check output to get version number
      run: |
        echo "release_version is $env:RELEASE_VERSION"
        if ($env:RELEASE_VERSION -eq $null -or $env:RELEASE_VERSION -eq '') {
          echo "Setting release version to 0.0.0"
          echo "RELEASE_VERSION=0.0.0" >> $env:GITHUB_ENV
        }
        
    outputs:
        release-version: ${{ env.RELEASE_VERSION }}

  call-build-test:
    needs: [check-tag-branch, get-version]
    uses: ./.github/workflows/build-test.yml
    with: 
      release-version: ${{ needs.get-version.outputs.release-version }}
      cache-build: true

  publish-it:
    needs: [check-tag-branch, get-version, call-build-test]
    uses: ./.github/workflows/publish.yml
    secrets:
      CHOCO_TOKEN: ${{ secrets.CHOCOTOKEN }}
    with: 
      release-version: ${{ needs.get-version.outputs.release-version }}

